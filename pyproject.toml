[project]
name = "de-journey"
version = "0.1.0"
description = ""
authors = [{ name = "Abrar Mudhir", email = "abrarmudhir@outlook.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.1,<3.0.0",
    "pandas>=2.2.2,<3.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.6.2",
    "pytest>=8.3.2,<9.0.0",
    "snowflake-snowpark-python[localtest]>=1.54.0",
]

[tool.black]
target-version = ["py311"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
